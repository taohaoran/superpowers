# GitHub Pages 部署 workflow（GitHub Actions 发布源）
# 内容源严格四级优先级: docs_archify/architecture_improve → docs_archify/architecture → docs/architecture_improve → docs/architecture
name: Deploy Superpowers docs to GitHub Pages

on:
  push:
    branches: [feat-docs-20260927]
    paths:
      - 'docs/**'
      - 'docs-archify/**'
      - 'docs_archify/**'
      - 'scripts/build-docs-html.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ---- 内容源严格四级优先级选源：archify 根下优先/回退子目录 → 部署根下优先/回退子目录 → 均无则回退部署根 ----
      - name: Build site content (strict 4-level source priority)
        run: |
          set -euo pipefail
          rm -rf site && mkdir -p site
          SRC=""
          ARCH_ROOT=""
          if [ -d "docs_archify" ]; then ARCH_ROOT="docs_archify"
          elif [ -d "docs-archify" ]; then ARCH_ROOT="docs-archify"
          fi
          if [ -n "$ARCH_ROOT" ] && [ -d "$ARCH_ROOT/architecture_improve" ]; then
            SRC="$ARCH_ROOT/architecture_improve"
          elif [ -n "$ARCH_ROOT" ] && [ -d "$ARCH_ROOT/architecture" ]; then
            SRC="$ARCH_ROOT/architecture"
          elif [ -d "docs/architecture_improve" ]; then
            SRC="docs/architecture_improve"
          elif [ -d "docs/architecture" ]; then
            SRC="docs/architecture"
          fi
          if [ -n "$SRC" ]; then
            echo "==> $SRC found -> deploying its content strictly"
            cp -R "$SRC/." site/
          else
            echo "==> none of the priority subdirs found -> deploying docs root"
            cp -R docs/. site/
          fi
          # ---- md 默认转 html + 强制生成导览 index.md（链接全部 md 与 html）并渲染为 index.html ----
          pip install --quiet markdown
          python3 scripts/build-docs-html.py site --site-name "Superpowers 架构文档" --group-label "" --label-map "runtime-bootstrap=运行时引导|skills-core=技能核心|project-operations=项目运作|harness-packaging=封装与分发|testing-evals=测试与评估|json=数据格式|_exploration=探索记录"
          touch site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
